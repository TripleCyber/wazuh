# TripleSOC sobre Wazuh 4.14.7 (single-node): indexer + manager + dashboard con la capa TripleSOC y los
# servicios propios (incidents, responder, rulesmith, receptor de webhooks).
#
# Antes del primer arranque: README.md, sección "Levantar TripleSOC". En resumen:
#   1. construir las imágenes (todas son locales: pull_policy never)
#   2. cp .env.example .env y los *.example de config/ sin la extensión, y cambiar los CAMBIAR-*
#   3. sudo ./generate-certs.sh
#   4. docker compose up -d
#   5. crear los usuarios de servicio (setup-*.sh), que dejan sus contraseñas en ./secrets
#
# Nada de este archivo es secreto: las contraseñas vienen de .env y de ./secrets, que no se suben a git.
name: triplesoc

x-logging: &logging
  driver: json-file
  options:
    max-size: 50m
    max-file: '3'

services:
  wazuh-indexer:
    image: 'triplesoc/wazuh-indexer:4.14.7'
    pull_policy: never
    container_name: wazuh-indexer-${SID:-triplesoc}
    hostname: wazuh-indexer
    restart: unless-stopped
    mem_limit: 4g
    environment:
      OPENSEARCH_JAVA_OPTS: '-Xms${INDEXER_HEAP:-2g} -Xmx${INDEXER_HEAP:-2g}'
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ['CMD-SHELL', 'curl -sk -o /dev/null https://localhost:9200 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging: *logging
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./certs/wazuh-indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh-indexer.pem
      - ./certs/wazuh-indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh-indexer.key
      - ./certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ./config/wazuh_indexer/opensearch.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml

  wazuh-manager:
    image: 'triplesoc/wazuh-manager:4.14.7'
    pull_policy: never
    container_name: wazuh-manager-${SID:-triplesoc}
    hostname: wazuh-manager
    restart: unless-stopped
    mem_limit: 2g
    depends_on:
      - wazuh-indexer
    ports:
      - '1514:1514'   # agentes (eventos)
      - '1515:1515'   # registro de agentes (con contraseña: config/wazuh_cluster/authd.pass)
    environment:
      INDEXER_URL: 'https://wazuh-indexer:9200'
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${INDEXER_PASSWORD:?falta INDEXER_PASSWORD en .env}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${API_PASSWORD:?falta API_PASSWORD en .env}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    healthcheck:
      test: ['CMD-SHELL', '/var/ossec/bin/wazuh-control status | grep -q "wazuh-remoted is running"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    logging: *logging
    volumes:
      - wazuh-api-configuration:/var/ossec/api/configuration
      - wazuh-etc:/var/ossec/etc
      - wazuh-logs:/var/ossec/logs
      - wazuh-queue:/var/ossec/queue
      - wazuh-var-multigroups:/var/ossec/var/multigroups
      - wazuh-integrations:/var/ossec/integrations
      - wazuh-active-response:/var/ossec/active-response/bin
      - wazuh-agentless:/var/ossec/agentless
      - wazuh-wodles:/var/ossec/wodles
      - filebeat-etc:/etc/filebeat
      - filebeat-var:/var/lib/filebeat
      - ./certs/root-ca.pem:/etc/ssl/root-ca.pem
      - ./certs/wazuh-manager.pem:/etc/ssl/filebeat.pem
      - ./certs/wazuh-manager-key.pem:/etc/ssl/filebeat.key
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
      - ./config/wazuh_cluster/authd.pass:/var/ossec/etc/authd.pass

  wazuh-dashboard:
    image: 'triplesoc/wazuh-dashboard:4.14.7'
    pull_policy: never
    container_name: wazuh-dashboard-${SID:-triplesoc}
    hostname: wazuh-dashboard
    restart: unless-stopped
    mem_limit: 1536m
    depends_on:
      - wazuh-indexer
      - wazuh-manager
    ports:
      - '127.0.0.1:${DASHBOARD_PORT:-5601}:5601'   # solo local: publicar con un proxy HTTPS delante
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${INDEXER_PASSWORD:?falta INDEXER_PASSWORD en .env}
      WAZUH_API_URL: 'https://wazuh-manager'
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?falta DASHBOARD_PASSWORD en .env}
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${API_PASSWORD:?falta API_PASSWORD en .env}
    healthcheck:
      test: ['CMD-SHELL', 'curl -s -o /dev/null http://localhost:5601 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    logging: *logging
    volumes:
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
      - ./certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml

  # Receptor interno de los webhooks del manager (alertas >= 12). Solo imprime lo que recibe en sus logs.
  triplesoc-webhook-receiver:
    image: 'triplesoc/webhook-receiver:1.1'
    pull_policy: never
    container_name: triplesoc-webhook-receiver-${SID:-triplesoc}
    restart: unless-stopped
    mem_limit: 64m
    healthcheck:
      # La imagen no lleva shell ni wget (solo Python).
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  # Correlación: agrupa alertas en incidentes (índice triplesoc-incidents*).
  triplesoc-incidents:
    image: 'triplesoc/incidents:1.2'
    pull_policy: never
    container_name: triplesoc-incidents-${SID:-triplesoc}
    restart: unless-stopped
    mem_limit: 96m
    depends_on:
      - wazuh-indexer
    environment:
      INDEXER_URL: 'https://wazuh-indexer:9200'
      INDEXER_USER: triplesoc_incidents
      MIN_LEVEL: '5'
      WINDOW_MIN: '30'
      SETTLE_SEC: '20'
      INTERVAL_SEC: '10'
      BACKFILL_HOURS: '168'
    logging: *logging
    volumes:
      - ./secrets/indexer:/run/triplesoc:ro
      - ./certs:/certs:ro

  # Respuesta: propone (MODE=approve) o ejecuta acciones del catálogo cerrado sobre los incidentes.
  triplesoc-responder:
    image: 'triplesoc/responder:0.18'
    pull_policy: never
    container_name: triplesoc-responder-${SID:-triplesoc}
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      - wazuh-indexer
      - wazuh-manager
    group_add:
      - '999'   # grupo wazuh: lectura de los logs del manager (volumen wazuh-logs)
    environment:
      INDEXER_URL: 'https://wazuh-indexer:9200'
      INDEXER_USER: triplesoc_incidents
      MODE: approve
      AI_PROVIDER: openai                         # API compatible con OpenAI (Groq): la usa también el chat del Guardian
      AI_BASE_URL: 'https://api.groq.com/openai/v1'
      AI_MODEL: openai/gpt-oss-120b
      MIN_RANK: '3'
      INTERVAL_SEC: '10'
      CRITICAL_AGENTS: '000'
    logging: *logging
    volumes:
      - ./secrets/indexer:/run/triplesoc:ro
      - ./secrets/responder:/run/triplesoc-secrets:ro
      - ./secrets/teams:/run/triplesoc-teams:ro
      - ./certs:/certs:ro
      - type: volume
        source: wazuh-logs
        target: /wazuh-logs
        read_only: true

  # Fábrica de reglas: redacta reglas a partir de lo que se pide en la pantalla AI Rules y las instala aprobadas.
  triplesoc-rulesmith:
    image: 'triplesoc/rulesmith:0.5'
    pull_policy: never
    container_name: triplesoc-rulesmith-${SID:-triplesoc}
    restart: unless-stopped
    mem_limit: 192m
    depends_on:
      - wazuh-indexer
      - wazuh-manager
    environment:
      INDEXER_URL: 'https://wazuh-indexer:9200'
      INDEXER_USER: triplesoc_incidents
      MODE: install
      AI_PROVIDER: openai
      AI_BASE_URL: 'https://api.groq.com/openai/v1'
      AI_MODEL: openai/gpt-oss-120b
      INTERVAL_SEC: '20'
      MAX_DRAFTS_PER_DAY: '40'
    logging: *logging
    volumes:
      - ./secrets/indexer:/run/triplesoc:ro
      - ./secrets/responder:/run/triplesoc-secrets:ro
      - ./secrets/rulesmith:/run/triplesoc-rulesmith:ro
      - ./certs:/certs:ro

volumes:
  wazuh-indexer-data:
  wazuh-api-configuration:
  wazuh-etc:
  wazuh-logs:
  wazuh-queue:
  wazuh-var-multigroups:
  wazuh-integrations:
  wazuh-active-response:
  wazuh-agentless:
  wazuh-wodles:
  filebeat-etc:
  filebeat-var:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:

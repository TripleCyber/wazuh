<!-- Grupo triplesoc-endpoints: configuración centralizada que el gestor envía a los agentes.
     El script y la lista de permitidos de esta carpeta llegan al agente en shared\ (Windows). -->
<agent_config os="Windows">
  <!-- Auditoría USB TripleSOC: cada 5 s; solo emite líneas cuando aparece un dispositivo nuevo.
       Cada pasada arranca PowerShell (~1,3 s de CPU): con 5 s es cerca de un cuarto de un núcleo.
       Requiere logcollector.remote_commands=1 en local_internal_options.conf (se fija al instalar). -->
  <localfile>
    <log_format>command</log_format>
    <command>powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File shared\triplesoc-usb-audit.ps1</command>
    <alias>triplesoc-usb</alias>
    <frequency>5</frequency>
  </localfile>

  <!-- Carril rápido: Windows anota cada disco que aparece en este canal (activo de fábrica) y el agente
       lo envía en el momento, sin esperar al sondeo de arriba. Solo discos USB (BusType 7) y solo la
       conexión (regla 100920). La auditoría de arriba sigue cubriendo teléfonos y dispositivos de entrada. -->
  <localfile>
    <location>Microsoft-Windows-Partition/Diagnostic</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=1006] and Event/EventData[Data[@Name='BusType']='7']</query>
  </localfile>

  <!-- Carril rápido para teléfonos: Windows anota aquí (canal activo de fábrica) cada vez que arranca el
       controlador MTP, es decir, cada vez que un teléfono entra en modo transferencia de archivos
       (regla 100923). El evento no dice qué dispositivo es; eso lo resuelve el script de respuesta. -->
  <localfile>
    <location>Microsoft-Windows-WPD-MTPClassDriver/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=1000]</query>
  </localfile>

  <!-- Carril rápido para dispositivos de entrada (ratón, teclado, "BadUSB"): Windows anota aquí (canal
       activo de fábrica) cada dispositivo que arranca por primera vez en un puerto (evento 410). Un ratón
       ya conocido que vuelve al mismo puerto no lo genera: en otro puerto sí. Regla 100928. -->
  <localfile>
    <location>Microsoft-Windows-Kernel-PnP/Configuration</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=410]</query>
  </localfile>
</agent_config>
